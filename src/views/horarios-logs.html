<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs de horarios</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/horarios-logs.css">
</head>
<body class="hide-status-right">

<div class="horarios-header">
  <div>
    <div class="horarios-title">Logs de horarios</div>
    <div class="horarios-sub">Trabajador: <span id="logs-user">-</span></div>
  </div>
  <div class="horarios-actions">
    <button class="btn btn-secondary" id="btn-logs-refrescar" title="Refrescar">Refrescar</button>
    <button class="btn btn-primary" id="btn-logs-pdf" title="Generar PDF">Generar PDF</button>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-row">
    <div class="filter-field">
      <label for="fecha-desde">Fecha</label>
      <input id="fecha-desde" type="date" class="form-control">
      <span style="color:var(--text3);font-size:12px">a</span>
      <input id="fecha-hasta" type="date" class="form-control">
    </div>
    <button class="filter-search-btn" id="btn-buscar">Buscar</button>
  </div>
</div>

<div class="horarios-main">
  <div class="table-card">
    <div class="table-header">
      <span class="table-title">Auditoria de fichajes</span>
      <span class="horarios-total" id="logs-total">0 registros</span>
    </div>
    <div class="table-scroll">
      <table class="logs-table">
        <thead>
          <tr>
            <th>Fecha/Hora</th>
            <th>Usuario</th>
            <th>Accion</th>
            <th>Campo</th>
            <th>Valor Anterior</th>
            <th>Valor Nuevo</th>
            <th>Motivo</th>
            <th>ID Fichaje</th>
            <th>ID Log</th>
          </tr>
        </thead>
        <tbody id="logs-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="statusbar" id="logs-status">
  <div class="status-filter"><span class="status-filter-icon">F</span>Filtrando: Fecha</div>
  <span class="statusbar-right">Registros: 0</span>
</div>

<div id="toast" class="toast"></div>

<script src="js/horarios-logs.js"></script>
</body>
</html>
